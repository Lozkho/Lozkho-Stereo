[package]
name = "lozkho-stereo"
version = "0.2.1"
description = "Aplicación de reproducción musical que simula una estación de radio"
authors = ["Lozkho Stereo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lozkho_stereo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Por defecto, con custom-protocol (sirve assets desde el bundle)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
